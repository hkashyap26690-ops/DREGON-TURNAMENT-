<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login UI</title>

  <!-- Firebase App -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- Firebase Firestore (optional database) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <link rel="manifest" href="manifest.json">
  
<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000; /* black background */
}

/* Bigger Box */
.login-box{
  width:380px;
  padding:45px;
  background:#111;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(255,255,255,0.1);
}

/* Title */
.login-box h2{
  margin-bottom:10px;
  color:white;
}

/* Subtitle */
.login-box p{
  font-size:13px;
  color:#aaa;
  margin-bottom:30px;
}

/* Button */
.google-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:white;
  color:black;
  transition:0.3s;
  width:100%;
}

.google-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(255,255,255,0.3);
}

/* Google icon */
.google-btn img{
  width:20px;
}

.small{
  margin-top:20px;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Welcome</h2>
  <p>Sign in to continue</p>

  <!-- Button -->
  <button class="google-btn" onclick="login()">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
    Sign in with Google
  </button>

  <div class="small">Secure Login System</div>
</div>

  <script src="script.js"></script>
<script>
  
firebase.auth().onAuthStateChanged((user) => {

  if(user){
    window.location.href = "home.html";
  }

});


</script>

</body>
</html>
