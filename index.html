<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login UI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* Card */
.login-box{
  width:320px;
  padding:35px;
  background:white;
  border-radius:18px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* Title */
.login-box h2{
  margin-bottom:10px;
  color:#333;
}

/* Subtitle */
.login-box p{
  font-size:13px;
  color:gray;
  margin-bottom:25px;
}

/* Google Button look */
.google-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:12px;
  border-radius:50px;
  border:1px solid #ddd;
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
  background:white;
}

.google-btn:hover{
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  transform:scale(1.03);
}

/* Logo */
.google-btn img{
  width:20px;
}

/* Footer text */
.small{
  margin-top:15px;
  font-size:11px;
  color:gray;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Welcome</h2>
  <p>Sign in to continue</p>

  <div class="google-btn">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
    Sign in with Google
  </div>

  <div class="small">Secure login system</div>
</div>

</body>
</html>
